openapi: 3.1.0
info:
  title: DAZAT Mobility API
  version: 0.0.55
  description: Engineering Phase 0.20 API. Organisation live operations are a task-scoped lens over canonical Booking, Dispatch, Journey, Safety, Finance, Rescue and Compliance truth, never a shadow trip system. P0-P3 attention requires ownership, a next action and deadline; resolved exceptions remain distinct from verified outcomes. Manual assignment and partner overflow never bypass current Driver, vehicle, accessibility or safeguarding eligibility. School handover failure blocks ordinary completion, hospital PASSENGER_NOT_READY remains distinct from no-show, authority funding expiry affects future service without creating passenger liability, and live changes return to canonical reauthorisation. Degraded mode forbids spreadsheet or personal-message shadow dispatch. Service health is evidence-backed and never automatically cancels a Booking. A signed agreement alone cannot launch; readiness and pilot gates remain explicit. Exit preserves active passengers, lawful records and open cases. Only public capability and authenticated tenant-scoped minimized reads are exposed. Institutional live mutations, external execution, direct database editing, provider bypass, AI authority invention and contract-exit abandonment remain disabled. Communication intent is separate from delivery and UNKNOWN is not delivery. Personal contact details are never exposed and no external provider execution is enabled. Caller ID is not authentication, confirmed structured fields outrank transcripts, no external telephony or Voice Assistant execution is enabled, and personal numbers are never exposed. Notification/Delivery Policy decisions preserve scope; Cases preserve priority, provider acceptance is not delivery, RECOVERING revalidates current state, metrics exclude sensitive content, and no provider, staff mutation or real-user scenario execution is enabled. Communications transports authoritative domain truth and never invents it. Priority grants no additional data access, provider acceptance is not delivery, stale and duplicate work is suppressed, and thirteen gates and separate accountable approvals are required. An Organisation account is not a second Booking engine and not an owner of passenger identity; the backend enforces active membership and cost centres are not Finance ledger truth.
servers:
  - url: http://localhost:3001
paths:
  /health/live:
    get:
      responses:
        '200': { description: Process is alive. }
  /health/ready:
    get:
      responses:
        '200': { description: Database reachable; feature dependency modes are reported explicitly. }
        '503': { description: Authoritative database unavailable. }
  /v1/identity/registrations:
    post:
      summary: Create Person, pending UserAccount, contact and requested profile(s).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartAccountRegistrationRequest' }
      responses:
        '202': { description: Registration started; contact remains unverified. }
  /v1/identity/verifications/contact:
    post:
      summary: Issue a short-lived contact verification challenge.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartContactVerificationRequest' }
      responses:
        '202': { description: Challenge committed; delivery may be DELIVERED or UNKNOWN. }
        '429': { description: Resend cooldown active. }
        '503': { description: Delivery provider is not configured. }
  /v1/identity/verifications/contact/confirm:
    post:
      summary: Verify contact and establish a revocable authenticated session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmContactVerificationRequest' }
      responses:
        '200': { description: Verification succeeded; bearer session returned once. }
        '400': { description: Invalid code. }
        '410': { description: Verification expired. }
        '423': { description: Verification locked/exhausted. }
  /v1/identity/session:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current authoritative session summary. }
        '401': { description: Missing/expired/revoked session. }
    delete:
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Session revoked. }
  /v1/identity/passkeys/registrations/options:
    post:
      security: [{ bearerAuth: [] }]
      responses:
        '503': { description: Fails closed until a standards-compliant WebAuthn ceremony provider is configured. }
  /v1/bookings:
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRiderBookingRequest' }
      responses:
        '201': { description: Authoritative DRAFT Booking created for authenticated Rider. }
  /v1/bookings/{bookingId}:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200': { description: Booking owned by authenticated booker. }
  /v1/bookings/{bookingId}/quote:
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Versioned Quote created and Booking moved to AWAITING_CONFIRMATION. }
        '503': { description: Pricing policy/provider not configured. }
  /v1/bookings/{bookingId}/confirm:
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId]
              properties:
                quoteId: { type: string, format: uuid }
      responses:
        '200': { description: FareAgreement created and immediate Booking reaches READY_FOR_DISPATCH. }
        '409': { description: Booking/Quote state conflict. }
  /v1/bookings/{bookingId}/dispatch:
    post:
      summary: Start the hard-filtered Dispatch search for a READY_FOR_DISPATCH Booking.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Controlled offer wave started, or truthful NO_ELIGIBLE_DRIVER returned. }
        '409': { description: Booking is not dispatchable from its current state. }
    get:
      summary: Read the booker's authoritative Dispatch/assignment projection.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200': { description: Current Booking/Dispatch/assignment projection. }
  /v1/driver/eligibility:
    get:
      summary: Explain the authenticated Driver's current hard-filter eligibility, including scoped operating permission.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: regionCode
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 32 }
        - name: vehicleId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Eligibility decision and explicit blocker codes. }
  /v1/driver/availability:
    put:
      summary: Set online/offline/break intent; going online revalidates compliance, vehicle and fresh location.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetDriverAvailabilityRequest' }
      responses:
        '200': { description: Availability committed with a new authoritative version. }
        '409': { description: Driver is not eligible; blocker codes returned. }
  /v1/driver/offers:
    get:
      summary: List the authenticated Driver's live, informed-choice and non-punitive offers.
      description: Pickup distance and ETA, service context and a Driver-earning estimate remain explicit. Acceptance fails closed when any required disclosure is unavailable; the Rider fare is never reused as the Driver earning.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Unexpired controlled offers. }
  /v1/driver/offers/{offerId}/accept:
    post:
      summary: Revalidate eligibility and atomically assign exactly one Driver to one Booking.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Atomic DriverAssignment and DRIVER_ASSIGNED Booking committed. }
        '409': { description: Offer expired/lost race or eligibility/state changed. }
  /v1/driver/offers/{offerId}/decline:
    post:
      summary: Decline a live offer without applying an ordinary acceptance-rate penalty.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode: { type: string, enum: [NOT_SUITABLE, TAKING_BREAK, FINISHING_SOON, OTHER] }
      responses:
        '200': { description: Offer declined; acceptanceRatePenaltyApplied is false. }
        '409': { description: Offer already terminal or expired. }
  /v1/bookings/{bookingId}/journey/acknowledge:
    post:
      summary: Assigned Driver acknowledges work and creates the authoritative EN_ROUTE Journey/first leg.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Active assignment materialised as Journey and advanced to EN_ROUTE. }
        '409': { description: Assignment or Booking state changed. }
  /v1/bookings/{bookingId}/journey:
    get:
      summary: Read the authorised Rider/Driver Journey projection for reconciliation.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200': { description: Current Journey projection with telemetry freshness and hold state. }
        '404': { description: Assigned Driver has not yet acknowledged and created the Journey. }
  /v1/bookings/{bookingId}/core-journey-progress:
    get:
      summary: Read canonical journey milestones as an authorised Rider Booking party.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Server-authoritative Booking-to-Finance progress; production charging remains disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoreJourneyProgressProjection' }
        '403': { description: Active Rider session required. }
        '404': { description: Booking is absent or outside the actor scope. }
  /v1/driver/bookings/{bookingId}/core-journey-progress:
    get:
      summary: Read canonical journey milestones as the assigned Driver.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Assignment-scoped progress without RideCheck secret or passenger Finance detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoreJourneyProgressProjection' }
        '403': { description: Active Driver session required. }
        '404': { description: Booking is absent or has no assignment for this Driver. }
  /v1/journeys/{journeyId}/location-observations:
    post:
      summary: Ingest an append-only, purpose-scoped Driver location observation with source, time, accuracy and confidence.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/JourneyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverLocationObservationRequest' }
      responses:
        '202': { description: Observation durably recorded; stale/degraded evidence remains explicitly labelled. }
  /v1/journeys/{journeyId}/arrived:
    post:
      summary: Mark arrival only after fresh, accurate, confident evidence falls inside the configured pickup radius.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Immutable arrival evidence accepted and Journey advanced to ARRIVED. }
        '409': { description: Location evidence is missing, stale, degraded or outside the radius. }
  /v1/journeys/{journeyId}/ridecheck/start:
    post:
      summary: Passenger starts protected RideCheck; the PIN is returned once and never persisted in plaintext.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Salted-verifier RideCheck session created and challenge returned once. }
        '409': { description: Journey is not in ARRIVED or a protected hold exists. }
  /v1/journeys/{journeyId}/ridecheck/verify:
    post:
      summary: Assigned Driver submits passenger PIN; mismatch is recorded without becoming a misconduct finding.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rideCheckSessionId, code]
              properties:
                rideCheckSessionId: { type: string, format: uuid }
                code: { type: string, pattern: '^\\d{6}$' }
      responses:
        '200': { description: Passenger/Driver/vehicle pairing verified. }
        '409': { description: Mismatch, expiry or exhausted attempts; protected start remains blocked. }
  /v1/journeys/{journeyId}/start:
    post:
      summary: Start only after verified RideCheck, active eligible assignment, fresh pickup evidence and no active hold.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Backend-validated JourneyStarted transition committed. }
        '409': { description: One or more protected-start preconditions failed. }
  /v1/journeys/{journeyId}/live:
    get:
      summary: Authorised current Journey projection; mutation clients must still revalidate owner state.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/JourneyId'
      responses:
        '200': { description: Authoritative Journey snapshot with health, telemetry confidence, pending changes and completion requirements. }
  /v1/journeys/{journeyId}/active:
    get:
      summary: Alias for the authoritative active Journey reconciliation snapshot.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/JourneyId'
      responses:
        '200': { description: Authoritative snapshot; reconnecting clients replace speculative local state. }
  /v1/journeys/{journeyId}/telemetry/location:
    post:
      summary: Append active Journey telemetry with confidence and movement-plausibility classification.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/JourneyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverLocationObservationRequest' }
      responses:
        '202': { description: Observation persisted; impossible jumps and out-of-order samples remain explicit degraded evidence. }
        '409': { description: Journey is not active or observation identity conflicts. }
  /v1/journeys/{journeyId}/stop-requests:
    post:
      summary: Request an additional stop without mutating the active route prematurely.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StopRequest' }
      responses:
        '202': { description: Request is PENDING_POLICY_REVIEW; pricing and Driver acknowledgement are not fabricated. }
        '409': { description: Expected Journey version is stale or Journey is inactive. }
  /v1/journeys/{journeyId}/route-change-requests:
    post:
      summary: Record a governed stop/destination request with an immutable requested location snapshot.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteChangeRequest' }
      responses:
        '202': { description: Request recorded but routeChanged remains false pending policy workflow. }
  /v1/journeys/{journeyId}/arriving:
    post:
      summary: Enter ARRIVING only with fresh, plausible destination-approach evidence.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Destination approach and completion-requirement snapshot committed. }
        '409': { description: Destination evidence is missing, stale, degraded, implausible or outside policy radius. }
  /v1/journeys/{journeyId}/complete:
    post:
      summary: Complete only after all authoritative destination, assignment, hold, continuity and handover guards pass.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Journey/Booking/assignment completed and Driver returned AVAILABLE; paymentInitiated is false. }
        '409': { description: One or more governed completion requirements failed. }
  /v1/safety/signals/sos:
    post:
      summary: Persist an SOS as a restricted INCIDENT signal before any external delivery attempt.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JourneySafetySignal' }
      responses:
        '201': { description: Canonical Safety event and restricted outbox record committed. }
  /v1/safety/signals/silent-assistance:
    post:
      summary: Persist Silent Assistance with a mandatory do-not-auto-call-reporter policy.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JourneySafetySignal' }
      responses:
        '201': { description: Signal committed locally first; external provider availability is not a persistence dependency. }
  /v1/safety/route-concerns:
    post:
      summary: Record a contextual route concern without creating an automatic misconduct finding.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteConcern' }
      responses:
        '201': { description: Restricted Safety event plus contextual route-deviation signal committed. }
  /v1/bookings/{bookingId}/payment-intents:
    post:
      summary: Prepare a provider-neutral PaymentIntent from the immutable FareAgreement after governed completion.
      description: Charging is disabled. This operation performs no provider call, captures no money, posts no ledger entries and does not change Booking state.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: CREATED intent persisted with providerActionAttempted=false and productionChargingEnabled=false.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreparePaymentIntentResult' }
        '409': { description: Booking is not COMPLETED, FareAgreement is missing, or idempotency state conflicts. }
  /v1/payments/{paymentId}/status:
    get:
      summary: Read DAZAT-owned PaymentIntent status without interpreting timeout as failure.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Canonical status. STATUS_UNKNOWN includes reconciliation guidance and forbids blind retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentStatusProjection' }
        '404': { description: PaymentIntent not found. }
  /v1/receipts/{bookingId}:
    get:
      summary: Read a receipt projection only when a captured Payment exists.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200': { description: Receipt derived from captured Payment truth. }
        '409': { description: Receipt not ready; completion or a prepared intent is not proof of payment. }
  /v1/driver/earnings:
    get:
      summary: Read separately posted DriverEarning records.
      description: Rider fare is never projected as a Driver earning and earnings do not imply payout.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Authoritative DriverEarning projection; may be empty after Journey completion.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverEarningsProjection' }
  /v1/driver/applications:
    post:
      summary: Start or resume the authenticated Driver's evidence-based application.
      description: The command recognises already-authoritative contact verification but cannot approve identity, documents, training, a vehicle, the application or operating eligibility. OCR/extraction is never authoritative compliance verification.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Resumable application projection; self-approval and operating eligibility remain false.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverApplicationProjection' }
  /v1/driver/application:
    get:
      summary: Read the authenticated Driver's latest authoritative application state.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Application progress without fabricated verification or approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverApplicationProjection' }
        '404': { description: Driver application has not been started. }
  /v1/driver/operating-eligibility:
    get:
      summary: Read derived Driver operating eligibility separately from availability.
      description: Uses current application, compliance, Driver/vehicle pairing, vehicle evidence, service permissions and scoped restrictions. Availability is evaluated separately; this projection does not put the Driver online.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: regionCode
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 32 }
        - name: vehicleId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: ELIGIBLE, PARTIALLY_ELIGIBLE or NOT_ELIGIBLE authoritative projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverOperatingEligibilityProjection' }
  /v1/fleet/marketplace:
    get:
      summary: List current evidence-backed Fleet Marketplace offers for a region.
      description: Returns only the latest published terms for available, currently eligible vehicles with explicit capabilities and verified supplier stock/warranty evidence. No purchase, reservation or generic discount claim is created.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: regionCode
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 32 }
      responses:
        '200':
          description: Current offers with total cost, deposit, term, mileage and included/excluded service truth.
          content:
            application/json:
              schema:
                type: object
                required: [offers]
                properties:
                  offers: { type: array, items: { $ref: '#/components/schemas/FleetMarketplaceOfferProjection' } }
  /v1/fleet/marketplace/{offerId}:
    get:
      summary: Read one current Fleet Marketplace offer version.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current immutable offer terms.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetMarketplaceOfferProjection' }
        '404': { description: Offer is absent, superseded, withdrawn, expired or no longer eligible/available. }
  /v1/driver/fleet-agreements:
    get:
      summary: List the authenticated Driver's latest FleetAgreement versions.
      description: Deposit values remain separate from platform revenue; this read route cannot accept or alter an agreement.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current agreement versions.
          content:
            application/json:
              schema:
                type: object
                required: [agreements]
                properties:
                  agreements: { type: array, items: { $ref: '#/components/schemas/FleetAgreementProjection' } }
  /v1/driver/vehicle-assignment-validation:
    get:
      summary: Revalidate Driver, vehicle, pair insurance, capability, agreement and operating truth.
      description: Replacement assignments require the same fresh hard checks. External FleetOrganisation tenancy never bypasses DAZAT authority.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vehicleId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: regionCode
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 32 }
        - name: replacementForAssignmentId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Read-only assignment validation; it does not assign or reserve a vehicle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleAssignmentValidationProjection' }
  /v1/driver/vehicles/{vehicleId}/maintenance:
    get:
      summary: Read the authenticated Driver's authoritative maintenance gate for an authorised vehicle.
      description: Maintenance plan, requirements, defects and scoped restrictions remain separate. Breakdown alone never proves Driver neglect, and reliability is not Driver compliance.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: serviceCodes
          in: query
          required: false
          description: Comma-separated service codes whose vehicle restrictions must be evaluated.
          schema: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Current plan, urgency, restriction, defect and operating-gate projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleMaintenanceProjection' }
        '404': { description: Vehicle is absent or not currently authorised for this Driver. }
  /v1/driver/vehicles/{vehicleId}/pre-shift-checks:
    post:
      summary: Record a concise Driver pre-shift observation.
      description: A Driver may say something does not feel right without diagnosis. A concern fails safe to review, creates no Driver fault finding and safety overrides dispatch or commercial pressure.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitPreShiftCheckRequest' }
      responses:
        '200':
          description: Immutable pre-shift result and any precautionary defect/restriction references.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreShiftCheckProjection' }
        '409': { description: Observation time or idempotency state conflicts with authoritative truth. }
  /v1/driver/perks:
    get:
      summary: List only current provider-verified Driver perk terms.
      description: Unverified fuel, charging, tyres, servicing, insurance, inspection or training benefits cannot be marketed.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: regionCode
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 32 }
      responses:
        '200':
          description: Current verified offers with explicit benefit, eligibility and redemption terms.
          content:
            application/json:
              schema:
                type: object
                required: [perks]
                properties:
                  perks: { type: array, items: { $ref: '#/components/schemas/VerifiedDriverPerkProjection' } }
  /v1/driver/fair-treatment:
    get:
      summary: Read separate Driver fair-treatment dimensions without an opaque Driver Score.
      description: Ratings are feedback, not findings. Allegation, Driver response, assessment, finding and action stay separate. Ordinary declines never create a hidden priority penalty.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current Driver-owned complaints, restrictions, appeals and separate dimension counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverFairTreatmentProjection' }
  /v1/driver/rider-conduct-cases:
    post:
      summary: Persist a Safety-owned Driver report of Rider conduct.
      description: Protects Drivers reporting violence, harassment, discrimination, fraud, dangerous behaviour or contact abuse. The report creates no automatic Driver misconduct finding.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitRiderConductReportRequest' }
      responses:
        '201':
          description: Canonical SafetyEvent and RiderConductCase persisted before external delivery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiderConductCaseProjection' }
        '409': { description: Actor, Journey or idempotency state conflicts with authoritative truth. }
  /v1/driver/journeys/{journeyId}/unsafe-termination:
    post:
      summary: Let the assigned Driver safely terminate an unsafe Journey.
      description: Atomically records Safety truth, interrupts the leg, cancels the assignment, opens passenger continuity, protects the Driver rating and creates no Driver fault finding.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RiderConductDetails'
      responses:
        '201':
          description: Unsafe Journey termination and passenger-continuity protection committed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnsafeJourneyTerminationProjection' }
        '409': { description: Journey is not an active assignment safely terminable by this Driver. }
  /v1/driver/appeals:
    post:
      summary: Submit a Driver appeal against a high-impact decision.
      description: Complaint findings, Driver restrictions, offboarding decisions and incentive qualifications are appealable. Independent review preserves original decision history.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitDriverAppealRequest' }
      responses:
        '201':
          description: Appeal submitted for governed independent review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmitDriverAppealProjection' }
        '404': { description: Appealable decision is not owned by this Driver. }
        '409': { description: Appeal or idempotency state conflicts with existing truth. }
  /v1/driver/incentives:
    get:
      summary: List current Finance-approved and auditable Driver incentives.
      description: Incentives remain separate from base earnings and cannot use acceptance coercion, unsafe fatigue pressure or a secret Dispatch-priority boost.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: regionCode
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 32 }
      responses:
        '200':
          description: Current approved incentive terms and the authenticated Driver's evidence-backed qualification, if evaluated.
          content:
            application/json:
              schema:
                type: object
                required: [incentives]
                properties:
                  incentives: { type: array, items: { $ref: '#/components/schemas/DriverIncentiveProjection' } }
  /v1/driver/daily-operations:
    get:
      summary: Read the authenticated Driver's complete authoritative daily-operations projection.
      description: Secure session, approved vehicle, eligibility, scheduled work, offers, assignment, Journey, earnings, BREAK, FINISHING_SOON and end-shift remain separate. OFFLINE stops ordinary app location collection.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current daily truth with explicit weak-signal state and unconfigured voice/CarPlay/Android Auto roadmap labels.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverDailyOperationsProjection' }
  /v1/driver/connectivity/reconciliations:
    post:
      summary: Replace speculative weak-signal state with authoritative server truth.
      description: Reconciliation never pretends queued SOS, silent assistance, Rider conduct, location or communication acknowledgements were executed; each requires canonical idempotent submission.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectivityReconciliationRequest' }
      responses:
        '200':
          description: Authoritative availability/Journey versions and safe resubmission routes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectivityReconciliationProjection' }
  /v1/driver/support-cases:
    get:
      summary: List the authenticated Driver's support cases.
      description: Safety, breakdown, payment, account, compliance, technical, passenger and fleet support remain typed and auditable.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Driver-owned support cases with explicit human-escalation state. }
    post:
      summary: Open a governed Driver Support case.
      description: High-risk active cases require human escalation. This checkpoint contacts no external provider or emergency service automatically.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenDriverSupportCaseRequest' }
      responses:
        '201':
          description: Support case persisted with risk and escalation truth.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverSupportCaseProjection' }
  /v1/driver/supply-demand:
    get:
      summary: Read evidence-backed current and forecast supply/demand by capability.
      description: Current observation and forecast remain separate; WAV, School and other capability supply are not hidden in a raw Driver count. No signal guarantees earnings.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: regionCode
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 32 }
        - name: capabilityCodes
          in: query
          description: Optional comma-separated capability codes.
          schema: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Current published evidence signals, or an empty list when none exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverSupplyProjection' }
  /v1/driver/bookings/{bookingId}/arrival-plan:
    get:
      summary: Read the assigned Driver's scoped arrival communication plan and chosen Booking pickup.
      description: The chosen Booking pickup is authoritative; passenger GPS is never assumed. Direct contact details remain protected and communication execution is disabled in this foundation.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Authoritative pickup with a configured or explicitly not-configured arrival plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArrivalCommunicationPlanProjection' }
        '403': { description: Booking is not assigned to this Driver. }
  /v1/communications:
    get:
      summary: Read the authenticated recipient's communication inbox and channel-health truth.
      description: Purpose, priority and acknowledgement state are authoritative. Missing or expired provider-health evidence is UNKNOWN; no external provider execution is enabled.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Recipient-scoped communication summaries and explicit channel health.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunicationInboxProjection' }
        '401': { description: Missing, expired or revoked session. }
  /v1/communications/{communicationId}:
    get:
      summary: Read one recipient-owned Communication and its separate delivery observations.
      description: QUEUED, SENT, DELIVERED, READ, FAILED, EXPIRED, UNKNOWN and SUPPRESSED_STALE stay distinct. Personal contact details are never exposed.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: communicationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Communication intent, delivery timeline and acknowledgement escalation truth.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunicationProjection' }
        '403': { description: Communication belongs to another recipient. }
        '404': { description: Communication not found. }
  /v1/communications/{communicationId}/acknowledgements:
    post:
      summary: Idempotently acknowledge a recipient-owned critical communication.
      description: Acknowledgement is a separate immutable fact. Delivery failure, UNKNOWN or a missed deadline can still require human escalation; no external contact is performed here.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: communicationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcknowledgeCommunicationRequest' }
      responses:
        '200':
          description: Acknowledgement persisted or the same idempotent result replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunicationAcknowledgementProjection' }
        '409': { description: Communication is not acknowledgeable or an idempotency identifier was reused. }
  /v1/telephony/capabilities:
    get:
      summary: Read the provider-disabled telephone and Voice Assistant capability boundary.
      description: Telephone uses the canonical service engines, but no telephony, Voice Assistant, call-control, recording, transcription, interpreter or secure-payment provider is configured.
      responses:
        '200':
          description: Explicitly disabled provider capabilities and supported human-handoff queues.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelephonyServiceCapabilitiesProjection' }
  /v1/contact-plan:
    get:
      summary: Read the authenticated person's current Contact Plan.
      description: Stores safe channels, permitted intermediary scope, language and operational accessibility communication needs without diagnoses or personal-contact exposure.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current versioned Contact Plan or an explicit NOT_CONFIGURED projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPlanProjection' }
        '401': { description: Missing, expired or revoked session. }
  /v1/telephony/interactions:
    get:
      summary: Read the authenticated person's telephone interaction history.
      description: Caller ID never authenticates, personal numbers are never exposed, and warm-handoff or dropped-call pending truth remains explicit.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Recipient-owned CallSession summaries; provider execution remains disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelephonyInteractionListProjection' }
        '401': { description: Missing, expired or revoked session. }
  /v1/communications/operations/capabilities:
    get:
      summary: Read the provider-disabled omnichannel operations capability boundary.
      description: Notification/Delivery Policy, Contact Case continuity, provider health, SLO evidence and isolated scenario truth are modelled, but no provider, staff mutation or real-user scenario execution is enabled.
      responses:
        '200':
          description: Explicit source capabilities and disabled execution boundaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunicationsOperationsCapabilitiesProjection' }
  /v1/contact-centre/cases:
    get:
      summary: Read the authenticated person's Contact Centre cases.
      description: Cases preserve priority, owner presence, next action, attention time, contactability and canonical links. They never replace Booking, Journey, Safety, Finance or Fleet truth, and personal communication tools are prohibited.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Recipient-owned cross-channel case summaries; no staff mutation is exposed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactCaseListProjection' }
        '401': { description: Missing, expired or revoked session. }
  /v1/communications/operations/status:
    get:
      summary: Read recipient-scoped delivery-assurance and aggregate channel-health truth.
      description: SENT is not delivery, provider acceptance is not delivery, contactability is temporary context, metrics exclude sensitive content, and RECOVERING revalidates current state before queued release.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Aggregate channel health plus this recipient's open critical failures and acknowledgement obligations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunicationsOperationsStatusProjection' }
        '401': { description: Missing, expired or revoked session. }
  /v1/communications/closure/capabilities:
    get:
      summary: Read the Communications Engine final-closure capability boundary.
      description: Canonical request/event envelopes, recipient permission, ordered routing, degraded mode, acceptance cases and launch gates are modelled. Endpoint access grants no domain authority and unmanaged provider bypass is prohibited.
      responses:
        '200':
          description: Final-closure catalogues and explicit disabled-execution truth.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunicationsClosureCapabilitiesProjection' }
  /v1/communications/closure/status:
    get:
      summary: Read the authenticated recipient's canonical communication-request coverage.
      description: Counts are recipient-scoped. Priority never expands data access, source events and role permission remain mandatory, and provider acceptance is not delivery.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Recipient-owned canonical request, stale-suppression and creation counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunicationsClosureStatusProjection' }
        '401': { description: Missing, expired or revoked session. }
  /v1/communications/closure/readiness:
    get:
      summary: Read Communications launch-gate evidence without enabling launch.
      description: All thirteen gates and separate accountable approvals are required. This checkpoint cannot enable a provider or claim pilot readiness.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Gate evidence defaults to NOT_TESTED and all production approvals remain false.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunicationsLaunchReadinessProjection' }
        '401': { description: Missing, expired or revoked session. }
  /v1/organisations/capabilities:
    get:
      summary: Read the Organisation Operations Part 1 capability boundary.
      description: Catalogues identity, lifecycle, roles, permissions, conceptual APIs, events, requirements and acceptance cases while reporting that staff mutations and integrations are disabled.
      responses:
        '200':
          description: Explicit organisation source capabilities and disabled-execution truth.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganisationOperationsCapabilitiesProjection' }
  /v1/organisations:
    get:
      summary: List only organisations owned by the authenticated actor's active memberships.
      description: Tenant access is derived server-side from current valid membership. A supplied organisation identifier, SSO assertion or Booking identifier does not grant authority.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Actor-owned active organisation memberships.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [organisations]
                properties:
                  organisations:
                    type: array
                    items: { $ref: '#/components/schemas/ActorOrganisationSummaryProjection' }
        '401': { description: Missing, expired or revoked session. }
  /v1/organisations/{organisationId}/context:
    get:
      summary: Read one authenticated actor-owned tenant context.
      description: The database query requires the requested organisation and authenticated person to match one current ACTIVE membership, then returns only that membership's role, permission, site and cost-centre scope plus aggregate counts.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganisationId'
      responses:
        '200':
          description: Tenant-scoped read-only organisation context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActorOrganisationContextProjection' }
        '400': { description: Organisation identifier is not a valid UUID. }
        '401': { description: Missing, expired or revoked session. }
        '404': { description: No active actor-owned membership exists for this organisation. }
  /v1/institutional-transport/capabilities:
    get:
      summary: Read the Organisation Operations Part 2 capability boundary.
      description: Catalogues passenger relationships, independent booking/funding authority, recurring canonical Booking occurrences, scheduling, readiness, bulk processing and exception truth while all mutations remain disabled.
      responses:
        '200':
          description: Institutional transport catalogues and explicit disabled-execution truth.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstitutionalTransportCapabilitiesProjection' }
  /v1/organisations/{organisationId}/institutional-transport:
    get:
      summary: Read one actor-owned institutional transport context.
      description: Requires a current ACTIVE membership for the authenticated person and requested organisation. Returns tenant-scoped counts and at most fifty owned open exceptions; no passenger diagnosis, other-tenant relationship or mutation authority is exposed.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganisationId'
      responses:
        '200':
          description: Read-only tenant-scoped institutional transport context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstitutionalTransportContextProjection' }
        '400': { description: Organisation identifier is not a valid UUID. }
        '401': { description: Missing, expired or revoked session. }
        '404': { description: No active actor-owned membership exists for this organisation. }
  /v1/organisation-commercial-operations/capabilities:
    get:
      summary: Read the Organisation Operations Part 3 capability boundary.
      description: Catalogues effective-dated agreements, policy precedence, approval, billing, credit, SLA, integration, export, lifecycle and migration truth while all commercial mutations remain disabled.
      responses:
        '200':
          description: Organisation commercial governance catalogues and explicit disabled-execution truth.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganisationCommercialCapabilitiesProjection' }
  /v1/organisations/{organisationId}/commercial-operations:
    get:
      summary: Read one actor-owned organisation commercial context.
      description: Requires a current ACTIVE membership for the authenticated person and requested organisation. Returns aggregate agreement, billing, approval, credit, service-case, simulation and renewal-risk truth without passenger, safeguarding, ledger or mutation authority.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganisationId'
      responses:
        '200':
          description: Read-only tenant-scoped organisation commercial context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganisationCommercialContextProjection' }
        '400': { description: Organisation identifier is not a valid UUID. }
        '401': { description: Missing, expired or revoked session. }
        '404': { description: No active actor-owned membership exists for this organisation. }
  /v1/institutional-live-operations/capabilities:
    get:
      summary: Read the Organisation Operations Part 4 and final closure capability boundary.
      description: Catalogues live attention, readiness, exceptions, canonical outcomes, disruption, partner, service-health, launch, pilot and exit truth while all institutional live mutations remain disabled.
      responses:
        '200':
          description: Institutional live-operations catalogues and explicit disabled-execution truth.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstitutionalLiveOperationsCapabilitiesProjection' }
  /v1/organisations/{organisationId}/live-operations:
    get:
      summary: Read one actor-owned institutional live-operations context.
      description: Requires a current ACTIVE membership and current assigned institutional operator task for the authenticated person and requested organisation. Returns minimized attention, exception, readiness, data-quality, disruption, health, launch, pilot and exit summaries without passenger manifests or specialist Safety and Finance detail.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganisationId'
      responses:
        '200':
          description: Read-only tenant-scoped institutional live-operations context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstitutionalLiveOperationsContextProjection' }
        '400': { description: Organisation identifier is not a valid UUID. }
        '401': { description: Missing, expired or revoked session. }
        '404': { description: No active actor-owned membership and current institutional operator task exist for this organisation. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JourneyId:
      name: journeyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentId:
      name: paymentId
      in: path
      required: true
      description: PaymentIntent identifier in the provider-disabled Phase 0.7 foundation.
      schema: { type: string, format: uuid }
    OrganisationId:
      name: organisationId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    CoreJourneyMilestone:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name: { type: string, enum: [BOOKING, FARE_AGREEMENT, DISPATCH, DRIVER_ASSIGNED, ARRIVAL, RIDECHECK, JOURNEY, FINANCE] }
        status: { type: string, enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, BLOCKED] }
    CoreJourneyProgressProjection:
      type: object
      additionalProperties: false
      required: [bookingId, bookingStatus, productionChargingEnabled, milestones, nextAction]
      properties:
        bookingId: { type: string, format: uuid }
        bookingStatus: { type: string }
        journeyId: { type: string, format: uuid }
        journeyStatus: { type: string }
        paymentIntentStatus: { type: string }
        productionChargingEnabled: { type: boolean, const: false }
        milestones: { type: array, minItems: 8, maxItems: 8, items: { $ref: '#/components/schemas/CoreJourneyMilestone' } }
        nextAction: { type: string }
    StartAccountRegistrationRequest:
      type: object
      required: [profileKind, preferredName, contact]
      properties:
        profileKind: { type: string, enum: [RIDER, DRIVER, BOTH] }
        preferredName: { type: string, minLength: 1, maxLength: 100 }
        contact:
          type: object
          required: [type, value]
          properties:
            type: { type: string, enum: [EMAIL, MOBILE] }
            value: { type: string }
    StartContactVerificationRequest:
      type: object
      required: [accountId, contactPointId]
      properties:
        accountId: { type: string, format: uuid }
        contactPointId: { type: string, format: uuid }
    ConfirmContactVerificationRequest:
      type: object
      required: [verificationId, code]
      properties:
        verificationId: { type: string, format: uuid }
        code: { type: string, pattern: '^\\d{6}$' }
    LocationInput:
      type: object
      required: [latitude, longitude, displayLabel]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        displayLabel: { type: string }
    CreateRiderBookingRequest:
      type: object
      required: [regionCode, pickup, dropoff]
      properties:
        regionCode: { type: string }
        pickup: { $ref: '#/components/schemas/LocationInput' }
        dropoff: { $ref: '#/components/schemas/LocationInput' }
        scheduledFor: { type: string, format: date-time }
    SetDriverAvailabilityRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [AVAILABLE, OFFLINE, BREAK, FINISHING_SOON] }
        regionCode: { type: string }
        vehicleId: { type: string, format: uuid }
        location:
          type: object
          required: [latitude, longitude, observedAt, source, confidence]
          properties:
            latitude: { type: number, minimum: -90, maximum: 90 }
            longitude: { type: number, minimum: -180, maximum: 180 }
            observedAt: { type: string, format: date-time }
            source: { type: string, enum: [DEVICE_GPS, FLEET_TELEMATICS] }
            confidence: { type: number, minimum: 0, maximum: 1 }
    DriverLocationObservationRequest:
      type: object
      required: [clientObservationId, latitude, longitude, observedAt, source, accuracyMetres, confidence]
      properties:
        clientObservationId: { type: string, format: uuid }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        observedAt: { type: string, format: date-time }
        source: { type: string, enum: [DEVICE_GPS, FLEET_TELEMATICS] }
        accuracyMetres: { type: number, minimum: 0 }
        confidence: { type: number, minimum: 0, maximum: 1 }
    StopRequest:
      type: object
      required: [location, expectedJourneyVersion, reasonCode]
      properties:
        location: { $ref: '#/components/schemas/LocationInput' }
        expectedJourneyVersion: { type: integer, minimum: 1 }
        reasonCode: { type: string, enum: [PASSENGER_REQUEST, ACCESSIBILITY_NEED, OPERATIONAL_NEED, OTHER] }
