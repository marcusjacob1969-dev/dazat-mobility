openapi: 3.1.0
info:
  title: DAZAT Mobility API
  version: 0.0.3
  description: Engineering Phase 0.3 API. Server/domain owners remain authoritative for identity, Booking and Pricing state.
servers:
  - url: http://localhost:3001
paths:
  /health/live:
    get:
      responses:
        '200': { description: Process is alive. }
  /health/ready:
    get:
      responses:
        '200': { description: Database reachable; feature dependency modes are reported explicitly. }
        '503': { description: Authoritative database unavailable. }
  /v1/identity/registrations:
    post:
      summary: Create Person, pending UserAccount, contact and requested profile(s).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartAccountRegistrationRequest' }
      responses:
        '202': { description: Registration started; contact remains unverified. }
  /v1/identity/verifications/contact:
    post:
      summary: Issue a short-lived contact verification challenge.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartContactVerificationRequest' }
      responses:
        '202': { description: Challenge committed; delivery may be DELIVERED or UNKNOWN. }
        '429': { description: Resend cooldown active. }
        '503': { description: Delivery provider is not configured. }
  /v1/identity/verifications/contact/confirm:
    post:
      summary: Verify contact and establish a revocable authenticated session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmContactVerificationRequest' }
      responses:
        '200': { description: Verification succeeded; bearer session returned once. }
        '400': { description: Invalid code. }
        '410': { description: Verification expired. }
        '423': { description: Verification locked/exhausted. }
  /v1/identity/session:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current authoritative session summary. }
        '401': { description: Missing/expired/revoked session. }
    delete:
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Session revoked. }
  /v1/identity/passkeys/registrations/options:
    post:
      security: [{ bearerAuth: [] }]
      responses:
        '503': { description: Fails closed until a standards-compliant WebAuthn ceremony provider is configured. }
  /v1/bookings:
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRiderBookingRequest' }
      responses:
        '201': { description: Authoritative DRAFT Booking created for authenticated Rider. }
  /v1/bookings/{bookingId}:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200': { description: Booking owned by authenticated booker. }
  /v1/bookings/{bookingId}/quote:
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Versioned Quote created and Booking moved to AWAITING_CONFIRMATION. }
        '503': { description: Pricing policy/provider not configured. }
  /v1/bookings/{bookingId}/confirm:
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId]
              properties:
                quoteId: { type: string, format: uuid }
      responses:
        '200': { description: FareAgreement created and immediate Booking reaches READY_FOR_DISPATCH. }
        '409': { description: Booking/Quote state conflict. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    StartAccountRegistrationRequest:
      type: object
      required: [profileKind, preferredName, contact]
      properties:
        profileKind: { type: string, enum: [RIDER, DRIVER, BOTH] }
        preferredName: { type: string, minLength: 1, maxLength: 100 }
        contact:
          type: object
          required: [type, value]
          properties:
            type: { type: string, enum: [EMAIL, MOBILE] }
            value: { type: string }
    StartContactVerificationRequest:
      type: object
      required: [accountId, contactPointId]
      properties:
        accountId: { type: string, format: uuid }
        contactPointId: { type: string, format: uuid }
    ConfirmContactVerificationRequest:
      type: object
      required: [verificationId, code]
      properties:
        verificationId: { type: string, format: uuid }
        code: { type: string, pattern: '^\\d{6}$' }
    LocationInput:
      type: object
      required: [latitude, longitude, displayLabel]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        displayLabel: { type: string }
    CreateRiderBookingRequest:
      type: object
      required: [regionCode, pickup, dropoff]
      properties:
        regionCode: { type: string }
        pickup: { $ref: '#/components/schemas/LocationInput' }
        dropoff: { $ref: '#/components/schemas/LocationInput' }
        scheduledFor: { type: string, format: date-time }
