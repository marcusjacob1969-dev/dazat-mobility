name: PostgreSQL migration verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Block high and critical dependency findings
        run: npm run audit:security
      - name: Compile and run source verification
        # Historical verifier contract: npm run build --workspaces --if-present && npm run check
        run: |
          npm run build:core
          npm run build --workspaces --if-present
          npm run check
          for phase in $(seq 25 54); do npm run "verify:phase-0-${phase}"; done
          npm run test:api-runtime
          npm run demo:core-journey

  migration-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: dazat_migration_verify_ci
          POSTGRES_USER: dazat_ci
          POSTGRES_PASSWORD: dazat_ci_${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dazat_ci -d dazat_migration_verify_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://dazat_ci:dazat_ci_${{ github.run_id }}@localhost:5432/dazat_migration_verify_ci
      DAZAT_MIGRATION_VALIDATION_TARGET: ephemeral
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Validate guarded runner source
        run: node scripts/verify-phase-0-21.mjs && node --test tests/domain/postgres-migration-runner-source.test.mjs
      - name: Execute migration chain on disposable PostGIS
        run: node scripts/verify-postgres-migrations.mjs
      - name: Compile API and validate core-journey SQL against migrated schema
        run: npm run build:core && npm run build --workspace @dazat/api && node scripts/verify-core-journey-postgres.mjs
      - name: Exercise authenticated core-journey HTTP against persisted fixtures
        run: node scripts/verify-core-journey-http-postgres.mjs
