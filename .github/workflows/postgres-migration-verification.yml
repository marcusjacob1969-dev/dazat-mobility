name: PostgreSQL migration verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dazat-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build production API image
        run: docker build --file services/api/Dockerfile --tag dazat-api:${{ github.sha }} .
      - name: Smoke-test production API image
        run: |
          trap 'docker logs dazat-api-smoke || true; docker logs dazat-postgres-smoke || true; docker rm --force dazat-api-smoke dazat-postgres-smoke || true; docker network rm dazat-smoke || true' EXIT
          test "$(docker image inspect --format '{{.Config.User}}' dazat-api:${{ github.sha }})" = "node"
          docker network create dazat-smoke
          docker run --detach --name dazat-postgres-smoke --network dazat-smoke \
            --env POSTGRES_DB=dazat_container_verify \
            --env POSTGRES_USER=dazat_ci \
            --env POSTGRES_PASSWORD=dazat_ci_container_only \
            --volume "$PWD/database/migrations:/docker-entrypoint-initdb.d:ro" \
            --health-cmd "pg_isready -U dazat_ci -d dazat_container_verify" \
            --health-interval 2s --health-timeout 3s --health-retries 30 \
            postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
          for attempt in $(seq 1 45); do
            test "$(docker inspect --format '{{.State.Health.Status}}' dazat-postgres-smoke)" = "healthy" && break
            test "$attempt" -lt 45
            sleep 2
          done
          docker run --detach --name dazat-api-smoke --network dazat-smoke --publish 3001:3001 \
            --env DATABASE_URL=postgresql://dazat_ci:dazat_ci_container_only@dazat-postgres-smoke:5432/dazat_container_verify \
            --env REDIS_URL=redis://127.0.0.1:6379 \
            --env CONTACT_VERIFICATION_PEPPER=ci-only-contact-pepper-000000000000 \
            --env RIDECHECK_PEPPER=ci-only-ridecheck-pepper-0000000000 \
            dazat-api:${{ github.sha }}
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:3001/health/live
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:3001/health/ready | grep --fixed-strings '"database":"READY"'
          curl --fail --retry 5 --retry-all-errors --retry-delay 1 http://127.0.0.1:3001/v1/build-info | grep --fixed-strings '"checkpoint":"engineering-phase-0.90"'
          docker stop --time 10 dazat-api-smoke
          test "$(docker inspect --format '{{.State.ExitCode}}' dazat-api-smoke)" = "0"

  workspace-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Generate and validate production API SBOM
        run: |
          mkdir -p artifacts/sbom
          npm sbom --workspace @dazat/api --omit=dev --sbom-format cyclonedx > artifacts/sbom/dazat-api.cdx.json
          node scripts/validate-api-sbom.mjs artifacts/sbom/dazat-api.cdx.json
      - name: Retain API SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dazat-api-sbom-${{ github.sha }}
          path: artifacts/sbom/dazat-api.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Generate and validate production API vulnerability evidence
        run: |
          npm audit --workspace @dazat/api --omit=dev --audit-level=high --json > artifacts/sbom/dazat-api-audit.json
          node scripts/validate-api-audit.mjs artifacts/sbom/dazat-api-audit.json
      - name: Retain API vulnerability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dazat-api-vulnerability-audit-${{ github.sha }}
          path: artifacts/sbom/dazat-api-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Block high and critical dependency findings
        run: npm run audit:security
      - name: Compile and run source verification
        # Historical verifier contract: npm run build --workspaces --if-present && npm run check
        run: |
          npm run build:core
          npm run build --workspaces --if-present
          npm run check
          for phase in $(seq 25 54); do npm run "verify:phase-0-${phase}"; done
          npm run test:api-runtime
          npm run demo:core-journey

  migration-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_DB: dazat_migration_verify_ci
          POSTGRES_USER: dazat_ci
          POSTGRES_PASSWORD: dazat_ci_${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dazat_ci -d dazat_migration_verify_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://dazat_ci:dazat_ci_${{ github.run_id }}@localhost:5432/dazat_migration_verify_ci
      DAZAT_MIGRATION_VALIDATION_TARGET: ephemeral
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Validate guarded runner source
        run: node scripts/verify-phase-0-21.mjs && node --test tests/domain/postgres-migration-runner-source.test.mjs
      - name: Execute migration chain on disposable PostGIS
        run: node scripts/verify-postgres-migrations.mjs
      - name: Compile API and validate core-journey SQL against migrated schema
        run: npm run build:core && npm run build --workspace @dazat/api && node scripts/verify-core-journey-postgres.mjs
      - name: Exercise authenticated core-journey HTTP against persisted fixtures
        run: node scripts/verify-core-journey-http-postgres.mjs
