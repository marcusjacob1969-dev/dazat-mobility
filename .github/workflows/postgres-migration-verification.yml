name: PostgreSQL migration verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Block high and critical dependency findings
        run: npm run audit:security
      - name: Compile and run source verification
        run: npm run build:core && npm run build --workspaces --if-present && npm run check && npm run verify:phase-0-25 && npm run verify:phase-0-26 && npm run verify:phase-0-27 && npm run verify:phase-0-28 && npm run verify:phase-0-29 && npm run verify:phase-0-30 && npm run verify:phase-0-31 && npm run verify:phase-0-32 && npm run verify:phase-0-33 && npm run verify:phase-0-34 && npm run verify:phase-0-35 && npm run verify:phase-0-36 && npm run test:api-runtime

  migration-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: dazat_migration_verify_ci
          POSTGRES_USER: dazat_ci
          POSTGRES_PASSWORD: dazat_ci_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dazat_ci -d dazat_migration_verify_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://dazat_ci:dazat_ci_local_only@localhost:5432/dazat_migration_verify_ci
      DAZAT_MIGRATION_VALIDATION_TARGET: ephemeral
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Validate guarded runner source
        run: node scripts/verify-phase-0-21.mjs && node --test tests/domain/postgres-migration-runner-source.test.mjs
      - name: Execute migration chain on disposable PostGIS
        run: node scripts/verify-postgres-migrations.mjs
